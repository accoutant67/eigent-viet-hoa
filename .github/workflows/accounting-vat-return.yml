name: Accounting VAT return draft

'on':
  push:
    branches:
      - 'codex/**'
    paths:
      - 'resources/example-skills/accounting-vat-return/**'
      - 'resources/example-skills/accounting-law-watch/**'
      - 'backend/tests/app/service/test_accounting_vat_skill_integration.py'
      - '.github/workflows/accounting-vat-return.yml'
  pull_request:
    branches:
      - main
      - codex/accounting-workbook-audit-mvp
    paths:
      - 'resources/example-skills/accounting-vat-return/**'
      - 'resources/example-skills/accounting-law-watch/**'
      - 'backend/tests/app/service/test_accounting_vat_skill_integration.py'
      - '.github/workflows/accounting-vat-return.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-vat-return-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vat-draft-tests:
    name: VAT unit, fixture, and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VAT workbook smoke dependencies
        run: python -m pip install 'defusedxml>=0.7.1' 'openpyxl>=3.1.5' 'jsonschema>=4.26.0'
      - name: Run VAT workflow unit tests
        run: python -m unittest discover -s resources/example-skills/accounting-vat-return/tests -p 'test_*.py' -v
      - name: Run VAT CLI end-to-end smoke
        run: python resources/example-skills/accounting-vat-return/tests/smoke_cli.py
      - name: Run law-watch change detection and regression fixtures
        run: python -m unittest discover -s resources/example-skills/accounting-law-watch/tests -p 'test_*.py' -v
      - name: Run law-watch fixture CLI smoke
        run: python resources/example-skills/accounting-law-watch/tests/smoke_cli.py
      - name: Run existing workbook audit CLI smoke
        run: python resources/example-skills/accounting-workbook-audit/tests/smoke_cli.py
      - name: Run existing workbook audit regression tests
        run: python -m unittest discover -s resources/example-skills/accounting-workbook-audit/tests -p 'test_*.py' -v

  eigent-skill-integration:
    name: Eigent Skill loading and permission integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync
      - name: Run VAT Skill integration test
        working-directory: backend
        run: uv run pytest tests/app/service/test_accounting_vat_skill_integration.py -v
